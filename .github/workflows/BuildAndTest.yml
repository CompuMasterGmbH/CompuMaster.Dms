name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: CI_CD

jobs:
  isolated-tests:
    name: Isolated tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: dotnet restore /p:configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build
        run: dotnet build --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run isolated tests
        run: dotnet test --framework net8.0 --results-directory test-results --logger junit --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore --filter "TestCategory!=RemoteDms"

      - name: Build demo applications and run BrowserUI smoke tests
        if: startsWith(matrix.os, 'windows')
        run: |
          dotnet build CompuMaster.Dms.TestDemo.ScopevisioTeamwork/CompuMaster.Dms.TestDemo.ScopevisioTeamwork.vbproj --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build CompuMaster.Dms.TestDemo.WebDav/CompuMaster.Dms.TestDemo.WebDav.vbproj --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build CompuMaster.Dms.TestDemo.OwnCloudClassic/CompuMaster.Dms.TestDemo.OwnCloudClassic.vbproj --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build CompuMaster.Dms.TestDemo.Nextcloud/CompuMaster.Dms.TestDemo.Nextcloud.vbproj --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build CompuMaster.Dms.Test.BrowserUI/CompuMaster.Dms.Test.BrowserUI.vbproj --configuration=${{ env.BUILD_CONFIGURATION }}
          dotnet vstest CompuMaster.Dms.Test.BrowserUI/bin/${{ env.BUILD_CONFIGURATION }}/net8.0-windows/CompuMaster.Dms.Test.BrowserUI.dll

      - name: Publish isolated test results (Linux)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && startsWith(matrix.os, 'ubuntu') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: Isolated Test Statistics (${{ matrix.os }})
          check_name: Isolated Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Publish isolated test results (Windows/macOS)
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        if: always() && !startsWith(matrix.os, 'ubuntu') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: Isolated Test Statistics (${{ matrix.os }})
          check_name: Isolated Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Upload isolated test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NUnit Isolated Test Results ${{ matrix.os }}
          path: test-results/TestResults.xml

  remote-integration-tests:
    name: ${{ matrix.server.displayName }} integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Every matrix entry identifies one physical remote server. Jobs for the same
    # server are serialized across workflows and operating systems, while jobs
    # using different servers can run independently. GitHub concurrency groups
    # are repository-scoped and do not protect local or cross-repository runs.
    concurrency:
      group: ${{ matrix.server.lock }}
      queue: max

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        server:
          - id: scopevisio-teamwork
            displayName: Scopevisio Teamwork
            category: ScopevisioTeamwork
            lock: dms-test-server-scopevisio-teamwork
          - id: owncloud-webdav
            displayName: OwnCloud WebDAV
            category: OwnCloudWebDav
            lock: dms-test-server-owncloud-webdav
          - id: generic-webdav
            displayName: Generic WebDAV on OwnCloud
            category: GenericWebDav
            lock: dms-test-server-owncloud-webdav
          - id: nextcloud-webdav
            displayName: Nextcloud WebDAV
            category: NextcloudWebDav
            lock: dms-test-server-nextcloud-webdav

    env:
      TEST_SCOPEVISIOTEAMWORK_USERNAME: ${{ matrix.server.id == 'scopevisio-teamwork' && secrets.TEST_SCOPEVISIOTEAMWORK_USERNAME || '' }}
      TEST_SCOPEVISIOTEAMWORK_CUSTOMERNO: ${{ matrix.server.id == 'scopevisio-teamwork' && secrets.TEST_SCOPEVISIOTEAMWORK_CUSTOMERNO || '' }}
      TEST_SCOPEVISIOTEAMWORK_PASSWORD: ${{ matrix.server.id == 'scopevisio-teamwork' && secrets.TEST_SCOPEVISIOTEAMWORK_PASSWORD || '' }}
      TEST_CMOWNCLOUD_SERVERURL: ${{ matrix.server.id == 'owncloud-webdav' && secrets.TEST_CMOWNCLOUD_SERVERURL || '' }}
      TEST_CMOWNCLOUD_USERNAME: ${{ matrix.server.id == 'owncloud-webdav' && secrets.TEST_CMOWNCLOUD_USERNAME || '' }}
      TEST_CMOWNCLOUD_PASSWORD: ${{ matrix.server.id == 'owncloud-webdav' && secrets.TEST_CMOWNCLOUD_PASSWORD || '' }}
      TEST_WEBDAV_SERVERURL: ${{ matrix.server.id == 'generic-webdav' && secrets.TEST_CMOWNCLOUD_SERVERURL || '' }}
      TEST_WEBDAV_USERNAME: ${{ matrix.server.id == 'generic-webdav' && secrets.TEST_CMOWNCLOUD_USERNAME || '' }}
      TEST_WEBDAV_PASSWORD: ${{ matrix.server.id == 'generic-webdav' && secrets.TEST_CMOWNCLOUD_PASSWORD || '' }}
      TEST_CMNEXTCLOUD_SERVERURL: ${{ matrix.server.id == 'nextcloud-webdav' && secrets.TEST_CMNEXTCLOUD_SERVERURL || '' }}
      TEST_CMNEXTCLOUD_USERNAME: ${{ matrix.server.id == 'nextcloud-webdav' && secrets.TEST_CMNEXTCLOUD_USERNAME || '' }}
      TEST_CMNEXTCLOUD_PASSWORD: ${{ matrix.server.id == 'nextcloud-webdav' && secrets.TEST_CMNEXTCLOUD_PASSWORD || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: List unixODBC drivers
        if: (!startsWith(matrix.os, 'windows'))
        continue-on-error: true
        run: odbcinst -q -d

      - name: Install dependencies
        run: dotnet restore CompuMaster.Dms.Test.Providers/CompuMaster.Dms.Test.Providers.vbproj /p:configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Run ${{ matrix.server.displayName }} integration tests
        run: dotnet test CompuMaster.Dms.Test.Providers/CompuMaster.Dms.Test.Providers.vbproj --framework net8.0 --results-directory test-results --logger junit --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore --filter "TestCategory=${{ matrix.server.category }}"

      - name: Publish integration test results (Linux)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && startsWith(matrix.os, 'ubuntu') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: ${{ matrix.server.displayName }} Test Statistics (${{ matrix.os }})
          check_name: ${{ matrix.server.displayName }} Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Publish integration test results (Windows/macOS)
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        if: always() && !startsWith(matrix.os, 'ubuntu') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: ${{ matrix.server.displayName }} Test Statistics (${{ matrix.os }})
          check_name: ${{ matrix.server.displayName }} Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NUnit ${{ matrix.server.id }} Test Results ${{ matrix.os }}
          path: test-results/TestResults.xml

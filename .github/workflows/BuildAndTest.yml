name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Repository default reads testing.ci-pipeline-attributes. Level 1 is quick; Level 2 is extended with coordinated native live access.'
        type: choice
        options: ['repository', '1', '2']
        default: 'repository'
      run_native_scopevisio:
        description: 'Native-only Level 2 verification; skips the default-package matrix and requires coordinated exclusive Scopevisio access.'
        type: boolean
        default: false
      native_dependency_mode:
        description: 'Native verification against released NuGet packages, or the historical pinned source chain.'
        type: choice
        options: [packages, source]
        default: packages
      exclusive_window_until:
        description: 'Confirmed exclusive-window end in ISO 8601 with UTC offset; each locked job needs 185 minutes remaining.'
        type: string
        default: ''
      transfer_mib:
        description: 'Actual live file transfer size in MiB (256 to 4096).'
        type: number
        default: 256
      native_scopevisio_mode:
        description: 'Verification runs all three OS; upload_boundary is a Windows-only diagnostic and does not satisfy large-transfer acceptance.'
        type: choice
        options: [verification, upload_boundary]
        default: verification

env:
  BUILD_CONFIGURATION: CI_CD

jobs:
  isolated-tests:
    name: Isolated tests (${{ matrix.os }})
    needs: prepare-remote-test-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: dotnet restore /p:configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build
        run: dotnet build --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run isolated tests
        run: dotnet test --framework net8.0 --results-directory test-results --logger junit --configuration=${{ env.BUILD_CONFIGURATION }} --no-restore --filter "${{ needs.prepare-remote-test-matrix.outputs.level == '2' && 'TestCategory!=RemoteDms' || 'TestCategory!=RemoteDms&TestCategory!=TestLevel2' }}"

      - name: Build Scopevisio Teamwork demo
        if: startsWith(matrix.os, 'windows')
        run: dotnet build CompuMaster.Dms.TestDemo.ScopevisioTeamwork/CompuMaster.Dms.TestDemo.ScopevisioTeamwork.vbproj --configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build WebDAV demo
        if: startsWith(matrix.os, 'windows')
        run: dotnet build CompuMaster.Dms.TestDemo.WebDav/CompuMaster.Dms.TestDemo.WebDav.vbproj --configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build OwnCloud Classic demo
        if: startsWith(matrix.os, 'windows')
        run: dotnet build CompuMaster.Dms.TestDemo.OwnCloudClassic/CompuMaster.Dms.TestDemo.OwnCloudClassic.vbproj --configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build Nextcloud demo
        if: startsWith(matrix.os, 'windows')
        run: dotnet build CompuMaster.Dms.TestDemo.Nextcloud/CompuMaster.Dms.TestDemo.Nextcloud.vbproj --configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build BrowserUI smoke tests
        if: startsWith(matrix.os, 'windows')
        run: dotnet build CompuMaster.Dms.Test.BrowserUI/CompuMaster.Dms.Test.BrowserUI.vbproj --configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Run BrowserUI smoke tests
        if: startsWith(matrix.os, 'windows')
        run: dotnet vstest CompuMaster.Dms.Test.BrowserUI/bin/${{ env.BUILD_CONFIGURATION }}/net8.0-windows/CompuMaster.Dms.Test.BrowserUI.dll --TestCaseFilter:"${{ needs.prepare-remote-test-matrix.outputs.level == '2' && 'TestCategory!=RemoteDms' || 'TestCategory!=RemoteDms&TestCategory!=TestLevel2' }}"

      - name: Publish isolated test results (Linux)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && startsWith(matrix.os, 'ubuntu') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: Isolated Test Statistics (${{ matrix.os }})
          check_name: Isolated Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Publish isolated test results (Windows)
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always() && startsWith(matrix.os, 'windows') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: Isolated Test Statistics (${{ matrix.os }})
          check_name: Isolated Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Publish isolated test results (macOS)
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: always() && startsWith(matrix.os, 'macos') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: Isolated Test Statistics (${{ matrix.os }})
          check_name: Isolated Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Upload isolated test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: NUnit Isolated Test Results ${{ matrix.os }}
          path: test-results/TestResults.xml

  prepare-remote-test-matrix:
    name: Prepare remote integration-test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      level: ${{ steps.level.outputs.level }}

    env:
      TEST_WEBDAV_SERVERURL: ${{ secrets.TEST_WEBDAV_SERVERURL }}
      TEST_WEBDAV_USERNAME: ${{ secrets.TEST_WEBDAV_USERNAME }}
      TEST_WEBDAV_PASSWORD: ${{ secrets.TEST_WEBDAV_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - id: level
        name: Read and validate test-level control
        shell: pwsh
        env:
          REQUESTED_TEST_LEVEL: ${{ inputs.test_level || 'repository' }}
          NATIVE_ONLY: ${{ inputs.run_native_scopevisio }}
        run: |
          ./.github/scripts/test-test-level-configuration.ps1
          $level = ./.github/scripts/read-test-level.ps1 -RequestedLevel $env:REQUESTED_TEST_LEVEL
          if ($env:NATIVE_ONLY -eq 'true') { $level = '2' }
          "level=$level" >> $env:GITHUB_OUTPUT
          Write-Host "Selected test level: $level"
      - id: matrix
        name: Select configured remote test servers
        shell: bash
        run: |
          if [[ -n "$TEST_WEBDAV_SERVERURL" && -n "$TEST_WEBDAV_USERNAME" && -n "$TEST_WEBDAV_PASSWORD" ]]; then
            matrix='{"os":["windows-latest","ubuntu-latest","macos-latest"],"server":[{"id":"scopevisio-teamwork","displayName":"Scopevisio Teamwork","category":"ScopevisioTeamwork","lock":"dms-test-server-scopevisio-teamwork"},{"id":"owncloud-webdav","displayName":"OwnCloud","category":"OwnCloud","lock":"dms-test-server-owncloud"},{"id":"generic-webdav","displayName":"WebDAV","category":"WebDav","lock":"dms-test-server-webdav"},{"id":"nextcloud-webdav","displayName":"Nextcloud","category":"Nextcloud","lock":"dms-test-server-nextcloud-webdav"}]}'
          else
            matrix='{"os":["windows-latest","ubuntu-latest","macos-latest"],"server":[{"id":"scopevisio-teamwork","displayName":"Scopevisio Teamwork","category":"ScopevisioTeamwork","lock":"dms-test-server-scopevisio-teamwork"},{"id":"owncloud-webdav","displayName":"OwnCloud","category":"OwnCloud","lock":"dms-test-server-owncloud"},{"id":"nextcloud-webdav","displayName":"Nextcloud","category":"Nextcloud","lock":"dms-test-server-nextcloud-webdav"}]}'
            echo "::notice::Skipping WebDAV integration-test jobs because TEST_WEBDAV_SERVERURL, TEST_WEBDAV_USERNAME, and TEST_WEBDAV_PASSWORD are not all configured."
          fi

          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  remote-integration-tests:
    # A native-only dispatch does not duplicate the default-package matrix.
    if: github.event_name != 'workflow_dispatch' || !inputs.run_native_scopevisio
    name: ${{ matrix.server.displayName }} integration tests (${{ matrix.os }}, Level ${{ needs.prepare-remote-test-matrix.outputs.level }})
    needs: prepare-remote-test-matrix
    runs-on: ${{ matrix.os }}

    # Every entry identifies one exclusive account/test dataset. Jobs for the same
    # account are serialized across workflows and operating systems. Independent
    # ownCloud/WebDAV accounts may share a host. GitHub concurrency groups
    # are repository-scoped and do not protect local or cross-repository runs.
    concurrency:
      group: ${{ matrix.server.lock }}
      queue: max

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-remote-test-matrix.outputs.matrix) }}

    env:
      DMS_TEST_LEVEL: ${{ needs.prepare-remote-test-matrix.outputs.level }}
      TEST_SCOPEVISIOTEAMWORK_USERNAME: ${{ matrix.server.id == 'scopevisio-teamwork' && secrets.TEST_SCOPEVISIOTEAMWORK_USERNAME || '' }}
      TEST_SCOPEVISIOTEAMWORK_CUSTOMERNO: ${{ matrix.server.id == 'scopevisio-teamwork' && secrets.TEST_SCOPEVISIOTEAMWORK_CUSTOMERNO || '' }}
      TEST_SCOPEVISIOTEAMWORK_PASSWORD: ${{ matrix.server.id == 'scopevisio-teamwork' && secrets.TEST_SCOPEVISIOTEAMWORK_PASSWORD || '' }}
      TEST_CMOWNCLOUD_SERVERURL: ${{ matrix.server.id == 'owncloud-webdav' && secrets.TEST_CMOWNCLOUD_SERVERURL || '' }}
      TEST_CMOWNCLOUD_USERNAME: ${{ matrix.server.id == 'owncloud-webdav' && secrets.TEST_CMOWNCLOUD_USERNAME || '' }}
      TEST_CMOWNCLOUD_PASSWORD: ${{ matrix.server.id == 'owncloud-webdav' && secrets.TEST_CMOWNCLOUD_PASSWORD || '' }}
      TEST_WEBDAV_SERVERURL: ${{ matrix.server.id == 'generic-webdav' && secrets.TEST_WEBDAV_SERVERURL || '' }}
      TEST_WEBDAV_USERNAME: ${{ matrix.server.id == 'generic-webdav' && secrets.TEST_WEBDAV_USERNAME || '' }}
      TEST_WEBDAV_PASSWORD: ${{ matrix.server.id == 'generic-webdav' && secrets.TEST_WEBDAV_PASSWORD || '' }}
      TEST_CMNEXTCLOUD_SERVERURL: ${{ matrix.server.id == 'nextcloud-webdav' && secrets.TEST_CMNEXTCLOUD_SERVERURL || '' }}
      TEST_CMNEXTCLOUD_USERNAME: ${{ matrix.server.id == 'nextcloud-webdav' && secrets.TEST_CMNEXTCLOUD_USERNAME || '' }}
      TEST_CMNEXTCLOUD_PASSWORD: ${{ matrix.server.id == 'nextcloud-webdav' && secrets.TEST_CMNEXTCLOUD_PASSWORD || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: List unixODBC drivers
        if: (!startsWith(matrix.os, 'windows'))
        continue-on-error: true
        run: odbcinst -q -d

      - name: Install dependencies
        run: dotnet restore CompuMaster.Dms.Test.Providers/CompuMaster.Dms.Test.Providers.vbproj /p:configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Run ${{ matrix.server.displayName }} integration tests
        shell: pwsh
        env:
          DMS_TEST_SERVER_CATEGORY: ${{ matrix.server.category }}
        run: ./.github/scripts/test-remote-dms.ps1 -TestLevel $env:DMS_TEST_LEVEL -ServerCategory $env:DMS_TEST_SERVER_CATEGORY

      - name: Publish integration test results (Linux)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && startsWith(matrix.os, 'ubuntu') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: ${{ matrix.server.displayName }} Test Statistics (${{ matrix.os }})
          check_name: ${{ matrix.server.displayName }} Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Publish integration test results (Windows)
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always() && startsWith(matrix.os, 'windows') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: ${{ matrix.server.displayName }} Test Statistics (${{ matrix.os }})
          check_name: ${{ matrix.server.displayName }} Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Publish integration test results (macOS)
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        if: always() && startsWith(matrix.os, 'macos') && hashFiles('test-results/TestResults.xml') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: test-results/TestResults.xml
          check_run_annotations: all tests
          comment_title: ${{ matrix.server.displayName }} Test Statistics (${{ matrix.os }})
          check_name: ${{ matrix.server.displayName }} Test Results (${{ matrix.os }})
          report_individual_runs: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: NUnit ${{ matrix.server.id }} Test Results ${{ matrix.os }}
          path: test-results/TestResults.xml

  native-scopevisio-live:
    name: Native Scopevisio live tests (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_scopevisio && needs.prepare-remote-test-matrix.outputs.level == '2'
    needs: [isolated-tests, prepare-remote-test-matrix]
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    # The same DMS account lock covers preparation, execution, and cleanup.
    # Manual opt-in also requires a coordinated window excluding other repositories/local runs.
    concurrency:
      group: dms-test-server-scopevisio-teamwork
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: ${{ inputs.native_scopevisio_mode == 'upload_boundary' && fromJSON('["windows-latest"]') || fromJSON('["windows-latest","ubuntu-latest","macos-latest"]') }}
    env:
      NATIVE_SCOPEVISIO_EXCLUSIVE_CI: 'true'
      TEST_SCOPEVISIOTEAMWORK_USERNAME: ${{ secrets.TEST_SCOPEVISIOTEAMWORK_USERNAME }}
      TEST_SCOPEVISIOTEAMWORK_CUSTOMERNO: ${{ secrets.TEST_SCOPEVISIOTEAMWORK_CUSTOMERNO }}
      TEST_SCOPEVISIOTEAMWORK_PASSWORD: ${{ secrets.TEST_SCOPEVISIOTEAMWORK_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned SDK draft
        if: inputs.native_dependency_mode == 'source'
        uses: actions/checkout@v5
        with:
          repository: CompuMasterGmbH/CompuMaster.CenterDevice.IO
          ref: 4a944d0e1c8650e273bacb7833e978be111a6d12
          path: .upstream/CenterDevice.IO
          persist-credentials: false
      - name: Checkout pinned OpenScope draft
        if: inputs.native_dependency_mode == 'source'
        uses: actions/checkout@v5
        with:
          repository: CompuMasterGmbH/CompuMaster.Scopevisio.OpenApi
          ref: 4de198023f78408dab83a6b8d3853bf4491d6741
          path: .upstream/OpenScope
          persist-credentials: false
      - name: Checkout pinned Teamwork draft
        if: inputs.native_dependency_mode == 'source'
        uses: actions/checkout@v5
        with:
          repository: CompuMasterGmbH/CompuMaster.Scopevisio.Teamwork
          ref: 91b456246890c3140f581478760166a1489e9453
          path: .upstream/Teamwork
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Verify coordinated native live access and run selected dependency mode
        shell: pwsh
        env:
          EXCLUSIVE_WINDOW_UNTIL: ${{ inputs.exclusive_window_until }}
          TRANSFER_MIB: ${{ inputs.transfer_mib }}
          NATIVE_SCOPEVISIO_MODE: ${{ inputs.native_scopevisio_mode }}
          NATIVE_DEPENDENCY_MODE: ${{ inputs.native_dependency_mode }}
        run: ./.github/scripts/test-native-scopevisio-live.ps1 -ExclusiveWindowUntil $env:EXCLUSIVE_WINDOW_UNTIL -TransferMiB $env:TRANSFER_MIB -Mode $env:NATIVE_SCOPEVISIO_MODE -DependencyMode $env:NATIVE_DEPENDENCY_MODE
      - name: Retain native live test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-scopevisio-live-${{ matrix.os }}
          path: native-live-results
          if-no-files-found: ignore

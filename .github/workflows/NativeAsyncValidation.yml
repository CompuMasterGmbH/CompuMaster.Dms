name: Native async source validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Validates the local level control; Windows/net8 is full, other platforms/runtimes use isolated samples.'
        type: choice
        options: ['repository', '1', '2']
        default: 'repository'

permissions:
  contents: read

jobs:
  isolated-native-async:
    name: Native async isolated tests (${{ matrix.os }}, ${{ startsWith(matrix.os, 'windows') && 'full net8 plus net48 samples' || 'samples' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned released SDK source
        uses: actions/checkout@v5
        with:
          repository: CompuMasterGmbH/CompuMaster.CenterDevice.IO
          ref: 0b89c9ae06735b228e01c4816842772e2b475cb0
          path: .upstream/CenterDevice.IO
          persist-credentials: false
      - name: Checkout pinned released OpenScope source
        uses: actions/checkout@v5
        with:
          repository: CompuMasterGmbH/CompuMaster.Scopevisio.OpenApi
          ref: a72dde455591cef65425b953bc6a6d56d6b03baf
          path: .upstream/OpenScope
          persist-credentials: false
      - name: Checkout pinned released Teamwork source
        uses: actions/checkout@v5
        with:
          repository: CompuMasterGmbH/CompuMaster.Scopevisio.Teamwork
          ref: 22715e921fe7644b6091906e4f4194df489413e8
          path: .upstream/Teamwork
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build and test the native source chain without remote servers
        shell: pwsh
        env:
          REQUESTED_TEST_LEVEL: ${{ inputs.test_level || 'repository' }}
          TEST_COVERAGE: ${{ startsWith(matrix.os, 'windows') && 'Full' || 'Sample' }}
        run: ./.github/scripts/test-native-async.ps1 -TestLevel $env:REQUESTED_TEST_LEVEL -Coverage $env:TEST_COVERAGE
      - name: Retain native isolated coverage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-isolated-${{ matrix.os }}
          path: native-isolated-results/
